[package]
name = "vanta-hdr"
version.workspace = true
edition.workspace = true
license.workspace = true

# Every decoder backed by a system library is a feature, so an app only links (and its
# package only depends on) what it actually decodes. The pure-Rust formats behind `image`
# (PNG, JPEG, WebP, TIFF, EXR, Radiance, ...) are always in.
[features]
default = ["avif", "jxl", "heif", "video", "icc", "raw"]
avif = []                     # system libavif via bindgen (build.rs)
jxl = ["dep:jpegxl-rs", "dep:jpegxl-sys"] # libjxl
heif = ["dep:libheif-rs", "dep:libheif-sys"] # libheif (HEIC/HEIF/AVCI)
video = ["dep:ffmpeg-next"]   # first frame of video files
icc = ["dep:lcms2"]           # transfer/primaries from embedded ICC profiles
raw = []                      # system libraw via bindgen (build.rs): camera RAW files

[dependencies]
ffmpeg-next = { version = "9.0.0", optional = true }
flate2 = "1.1.9"
sha1 = "0.11.0"
half = "2"
image = "0.25.10"
jpegxl-rs = { version = "0.15.0", optional = true }
jpegxl-sys = { version = "0.13.0", optional = true }
lcms2 = { version = "6.1.1", optional = true }
libheif-rs = { version = "3.0.0", optional = true }
libheif-sys = { version = "5.3.1", optional = true }
png = "0.18.1"
rayon = "1.12.0"

[build-dependencies]
bindgen = "0.72.1"
pkg-config = "0.3.34"
